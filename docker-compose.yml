version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tracking-spese-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking_spese}
      POSTGRES_USER: ${POSTGRES_USER:-tracking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracking_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracking-spese-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracking_user}:${POSTGRES_PASSWORD:-tracking_password}@db:5432/${POSTGRES_DB:-tracking_spese}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-30d}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID}
      ENABLE_BANKING_KEY_PATH: /app/secrets/e83dda61-4521-4f88-883d-bcc5792f6f4b.pem
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-https://spese.andrea-mauri.duckdns.org/banking/callback}
      ENABLE_BANKING_BASE_URL: ${ENABLE_BANKING_BASE_URL:-https://api.enablebanking.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:andreamauri2013@gmail.com}
    volumes:
      - ./e83dda61-4521-4f88-883d-bcc5792f6f4b.pem:/app/secrets/e83dda61-4521-4f88-883d-bcc5792f6f4b.pem:ro
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tracking-spese-frontend
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tracking-spese-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - frontend
      - web-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (accessible only on port 8093)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tracking-spese-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tracking-spese.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8093:80"
    networks:
      - backend
    depends_on:
      - db

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  web-proxy:
    external: true

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
