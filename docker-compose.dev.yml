version: '3.8'

services:
  # PostgreSQL Database for Development
  db:
    image: postgres:16-alpine
    container_name: tracking-spese-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking_spese}
      POSTGRES_USER: ${POSTGRES_USER:-tracking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - tracking-spese-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracking_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Development
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tracking-spese-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "8093:80"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    networks:
      - tracking-spese-dev
    depends_on:
      - db

networks:
  tracking-spese-dev:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

